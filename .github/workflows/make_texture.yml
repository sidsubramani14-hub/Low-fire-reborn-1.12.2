name: Generate Low Fire Texture

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Pillow
      run: pip install Pillow

    - name: Run Script
      run: python generate_fire.py

    - name: Format and Duplicate for Eaglercraft
      run: |
        mkdir -p assets/minecraft/textures/misc/
        
        # Eaglercraft uses fire_layer_0 and fire_layer_1
        cp texture_fire_layer.png assets/minecraft/textures/misc/fire_layer_0.png
        cp texture_fire_layer.png assets/minecraft/textures/misc/fire_layer_1.png
        
        # Copy the animation codes over
        echo '{"animation":{"frametime":2,"interpolate":true}}' > assets/minecraft/textures/misc/fire_layer_0.png.mcmeta
        echo '{"animation":{"frametime":2,"interpolate":true}}' > assets/minecraft/textures/misc/fire_layer_1.png.mcmeta

    - name: Commit and Push Image
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "actions@github.com"
        git add assets/minecraft/textures/misc/*
        git commit -m "Fixed fire textures for Eaglercraft 1.12.2 layout" || exit 0
        git push
